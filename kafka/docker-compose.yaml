services:
  ecommerce-kafka-1:
    image: confluentinc/cp-kafka:latest
    container_name: ecommerce-kafka-1
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@ecommerce-kafka-1:9091,2@ecommerce-kafka-2:9091,3@ecommerce-kafka-3:9091'
      KAFKA_LISTENERS: 'PLAINTEXT://:9090,CONTROLLER://ecommerce-kafka-1:9091,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://ecommerce-kafka-1:9090,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      # Replicates consumer offset tracking across all 3 brokers.
      # If 1 or 2 brokers crash,
      # consumers will not lose track of which messages they already processed.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      # Gives multiple consumer instances 3 seconds to join the group together
      # when an application scales up or restarts
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      # Dynamic formula = (N/2 + 1)
      # Requires at least 2 replicas to acknowledge a transactional write.
      # This guarantees data durability while still tolerating 1 broker going offline
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      # Replicates transaction metadata across all 3 brokers
      # so active transactions survive node failures.
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    volumes:
      - ecommerce-kafka-1-vol:/var/lib/kafka/data
    networks:
      - ecommerce-net
  ecommerce-kafka-2:
    image: confluentinc/cp-kafka:latest
    container_name: ecommerce-kafka-2
    ports:
      - "29094:9094"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@ecommerce-kafka-1:9091,2@ecommerce-kafka-2:9091,3@ecommerce-kafka-3:9091'
      KAFKA_LISTENERS: 'PLAINTEXT://:9090,CONTROLLER://ecommerce-kafka-2:9091,EXTERNAL://:9094'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://ecommerce-kafka-2:9090,EXTERNAL://localhost:29094
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    volumes:
      - ./secrets:/etc/kafka/secrets
      - ./config:/etc/kafka/config
      - ecommerce-kafka-2-vol:/var/lib/kafka/data
    networks:
      - ecommerce-net
  ecommerce-kafka-3:
    image: confluentinc/cp-kafka:latest
    container_name: ecommerce-kafka-3
    ports:
      - "29096:9096"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@ecommerce-kafka-1:9091,2@ecommerce-kafka-2:9091,3@ecommerce-kafka-3:9091'
      KAFKA_LISTENERS: 'PLAINTEXT://:9090,CONTROLLER://ecommerce-kafka-3:9091,EXTERNAL://:9096'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://ecommerce-kafka-3:9090,EXTERNAL://localhost:29096
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    volumes:
      - ./secrets:/etc/kafka/secrets
      - ./config:/etc/kafka/config
      - ecommerce-kafka-3-vol:/var/lib/kafka/data
    networks:
      - ecommerce-net
  ecommerce-kafbat-ui:
    container_name: ecommerce-kafbat-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - 18080:8080
    depends_on:
      - ecommerce-kafka-1
      - ecommerce-kafka-2
      - ecommerce-kafka-3
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ecommerce-kafka-1:9090,ecommerce-kafka-2:9090,ecommerce-kafka-3:9090
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      ecommerce-net:

volumes:
  ecommerce-kafka-1-vol:
  ecommerce-kafka-2-vol:
  ecommerce-kafka-3-vol:
  ecommerce-kafka-ui-data:

networks:
  ecommerce-net:
    external: true