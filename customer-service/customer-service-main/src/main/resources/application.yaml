feign:
  sentinel:
    enabled: true

# Change customer service running port
server:
  port: 0
  forward-headers-strategy: framework

spring:
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 10m        # default TTL for all caches
      cache-null-values: false

  application:
    name: customer-service
  profiles:
    active: dev # profile namespace
  config:
    import:
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension} # order-service.yaml
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8081
        port: 8719
      eager: true
      web-context-unify: false

    nacos:
      discovery:
        namespace: ${spring.profiles.active}
      username: nacos
      password: nacos
      server-addr: 127.0.0.1:8848
      config:
        file-extension: yaml # Make sure it match with file extension
        namespace: ${spring.profiles.active} #(dev) The correct namespace

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    driver-class-name: org.postgresql.Driver
    username: ecommerce_usr
    password: qwerqwer
    url: jdbc:postgresql://localhost:8432/db_customer
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true