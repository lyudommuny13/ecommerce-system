# Change order service running port
# Run jar file command: java -jar order-service-main-0.0.1-SNAPSHOT.jar
# Run change profile namespace: java -jar -Dspring.profiles.active=dev order-service-main-0.0.1-SNAPSHOT.jar
# Run multiple port: java -jar -Dspring.profiles.active=prod -Dserver.port=8551 order-service-main-0.0.1-SNAPSHOT.jar

server:
  port: 8550
  forward-headers-strategy: framework

spring:
  application:
    name: order-service
  profiles:
    active: dev # profile namespace
  config:
    import:
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension} # order-service.yaml
  cloud:
    nacos:
      discovery:
        namespace: ${spring.profiles.active}
      username: nacos
      password: nacos
      server-addr: 127.0.0.1:8848
      config:
        file-extension: yaml # Make sure it match with file extension
        namespace: ${spring.profiles.active} #(dev) The correct namespace


  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    driver-class-name: org.postgresql.Driver
    username: ecommerce_usr
    password: qwerqwer
    url: jdbc:postgresql://localhost:8432/db_order

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8888/realms/ecommerce