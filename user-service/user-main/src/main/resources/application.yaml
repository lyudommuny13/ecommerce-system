# Change payment service running port
server:
  port: 0
  forward-headers-strategy: framework

spring:
  application:
    name: user-service
  profiles:
    active: dev # profile namespace
  config:
    import:
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension} # order-service.yaml
  cloud:
    nacos:
      discovery:
        namespace: ${spring.profiles.active}
      username: nacos
      password: nacos
      server-addr: 127.0.0.1:8848
      config:
        file-extension: yaml # Make sure it match with file extension
        namespace: ${spring.profiles.active} #(dev) The correct namespace

  datasource:
    driver-class-name: org.postgresql.Driver
    username: ecommerce_usr
    password: qwerqwer
    url: jdbc:postgresql://localhost:8432/db_user
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true